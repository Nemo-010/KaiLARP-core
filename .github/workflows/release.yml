name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag (defaults to v<package.json version>)'
        required: false

permissions:
  contents: write

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node bin/kailarp-verify.js
      - name: package the evidence
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          cp out/verification.json "release/kailarp-core-verification-${version}.json"
          cp out/verification.md "release/kailarp-core-verification-${version}.md"
          mkdir -p release/screen
          cp out/demo/screen/*.webm out/demo/screen/*.mp4 release/screen/ 2>/dev/null || true
          cp out/real-youtube-run/screen/*.mp4 release/screen/ 2>/dev/null || true
          (cd out && zip -qr "../release/kailarp-core-evidence-${version}.zip" .)
          ls -la release release/screen
      - uses: actions/upload-artifact@v4
        with:
          name: core-release-assets
          path: release/

  publish:
    name: publish the github release
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-release-assets
          path: release
      - name: create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="$GITHUB_REF_NAME"
          [ -n "$tag" ] || tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "KaiLARP-core $tag" --generate-notes
          gh release upload "$tag" release/* release/screen/* --clobber
